name: Check and deploy GitHub Pages
on:
  push:
    branches: [main, fix-decision-model-id-20261016]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install Chromium for isolated browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Run TEST-ONLY-MOCK browser regressions (no paid API calls)
        run: npm run test:browser
      - name: Upload labeled browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-MOCK-browser-evidence
          path: test-results/
          retention-days: 7
      - name: Docker build and runtime smoke
        run: |
          docker build -t decision-atelier:ci .
          docker run -d --name decision-atelier-ci --read-only --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:8080:8080 decision-atelier:ci
          trap 'docker logs decision-atelier-ci; docker rm -f decision-atelier-ci' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q ok
          curl -fsS http://127.0.0.1:8080/ | grep -q "Decision Atelier"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "Content-Security-Policy"
          test "$(docker exec decision-atelier-ci id -u)" != 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
