name: Check and deploy GitHub Pages
on:
  push:
    branches: [main, fix-decision-model-picker-20261016]
  workflow_dispatch:
permissions:
  contents: read
  pages: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install Chromium for isolated browser regression tests
        run: npx playwright install --with-deps chromium
      - name: Run TEST-ONLY-MOCK browser regressions (no paid API calls)
        run: npm run test:browser
      - name: Upload labeled browser test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST-ONLY-MOCK-browser-evidence
          path: test-results/
          retention-days: 7
      - name: Docker build and runtime smoke
        run: |
          docker build -t decision-atelier:ci .
          docker run -d --name decision-atelier-ci --read-only --cap-drop=ALL --security-opt=no-new-privileges -p 127.0.0.1:8080:8080 decision-atelier:ci
          trap 'docker logs decision-atelier-ci; docker rm -f decision-atelier-ci' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q ok
          curl -fsS http://127.0.0.1:8080/ | grep -q "Decision Atelier"
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "Content-Security-Policy"
          test "$(docker exec decision-atelier-ci id -u)" != 0
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed public asset hashes (no API key or inference)
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const files = ['index.html', 'styles.css', 'app.js', 'core.js', 'credentials.js', 'presentation.js', 'examples.js', 'model.js', 'favicon.svg'];
          const digest = bytes => createHash('sha256').update(bytes).digest('hex');
          const expected = new Map(await Promise.all(files.map(async file => [file, digest(await readFile('public/' + file))])));
          const base = 'https://check5004.github.io/decision-ai-explorer/';
          let failures = [];
          for (let attempt = 1; attempt <= 12; attempt++) {
            failures = (await Promise.all(files.map(async file => {
              try {
                const response = await fetch(base + file + '?release=' + process.env.GITHUB_SHA + '&attempt=' + attempt, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
                if (!response.ok) return file + ': HTTP ' + response.status;
                return digest(Buffer.from(await response.arrayBuffer())) === expected.get(file) ? null : file + ': content hash mismatch';
              } catch { return file + ': unavailable'; }
            }))).filter(Boolean);
            if (!failures.length) { console.log('All 9 public asset hashes match commit ' + process.env.GITHUB_SHA); break; }
            console.log('Propagation check ' + attempt + ': ' + failures.join(', '));
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (failures.length) process.exit(1);
          NODE
